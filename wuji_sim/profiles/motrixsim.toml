# MotrixSim simulator settings, not hand model truth values; `source` formats and overrides: docs/platforms.md.
# MotrixSim has no MuJoCo integrator or line-search knobs, so this profile carries no option.integrator or
# option.ls_iterations; the backend picks its own integration scheme (actuator damping is integrated implicitly).
# option.tolerance is likewise absent: MotrixSim's velocity-space residual criterion is not equivalent to
# MuJoCo's inertia-normalized one, so the backend default (1e-4) applies.

[option]
source = "default: MotrixSim 1.0.0"

[option.timestep]
value = 0.005
unit = "s"
source = "choice"

[option.solver]
value = "Newton"
unit = "enum"
source = "choice"

[option.iterations]
value = 100
unit = "count"

[contact]
source = "default: MuJoCo 3.11.0"

[contact.geom_friction]
value = [0.7, 0.005, 0.0001]
unit = "[1, m, m]"
source = "choice"

[contact.geom_solref]
value = [0.02, 1.0]
unit = "[s, 1]"

[contact.geom_solimp]
value = [0.9, 0.95, 0.001, 0.5, 2.0]
unit = "[1, 1, m, 1, 1]"

[contact.geom_condim]
value = 4
unit = "count"
source = "choice"

[joint_coulomb_friction]
source = "estimate"

[joint_coulomb_friction.l_thumb_cmc_flex]
