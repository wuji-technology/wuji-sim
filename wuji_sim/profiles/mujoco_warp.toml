# MuJoCo Warp simulator settings, not hand model truth values; `source` formats and overrides: docs/platforms.md.

[option]
source = "default: mjlab 1.6.0"

[option.timestep]
value = 0.005
unit = "s"
source = "choice"

[option.integrator]
value = "implicitfast"
unit = "enum"

[option.solver]
value = "Newton"
unit = "enum"

[option.iterations]
value = 100
unit = "count"

[option.tolerance]
value = 1e-6
unit = "1"
source = "default: MuJoCo Warp 3.11.0"

[option.ls_iterations]
value = 50
unit = "count"

[contact]
source = "default: MuJoCo 3.11.0"

[contact.geom_friction]
value = [0.7, 0.005, 0.0001]
unit = "[1, m, m]"
source = "choice"

[contact.geom_solref]
value = [0.02, 1.0]
unit = "[s, 1]"

[contact.geom_solimp]
value = [0.9, 0.95, 0.001, 0.5, 2.0]
unit = "[1, 1, m, 1, 1]"

[contact.geom_condim]
value = 4
unit = "count"
source = "choice"

