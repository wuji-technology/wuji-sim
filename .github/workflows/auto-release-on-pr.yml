# Tags vX.Y.Z when a release/vX.Y.Z PR with the auto-release label merges; auto-release.yml creates the Release.

name: Auto Release on PR Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  create-tag:
    name: Create release tag
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'auto-release') &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-24.04

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-tags: true

      - name: Extract version
        id: tag
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION="${BRANCH_NAME#release/}"

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid version format: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # A re-run after the release pipeline already tagged this merge commit succeeds without a new tag.
          if existing=$(git rev-parse --verify --quiet "refs/tags/$VERSION^{commit}"); then
            if [[ "$existing" == "$(git rev-parse HEAD)" ]]; then
              echo "Tag $VERSION already on $existing"
              exit 0
            fi
            echo "::error::Tag $VERSION already exists on $existing, not on $(git rev-parse HEAD)"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"

          echo "Tag ${VERSION} created"
